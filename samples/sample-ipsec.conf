# Sample StrongSwan / Libreswan IPsec Configuration for Testing
conn production-vpn
    authby=secret
    keyexchange=ikev1
    ike=3des-sha1-modp1024
    esp=aes256-sha1
    aggressive=yes
    dpddelay=180s
    dpdaction=restart
    ikelifetime=8h
    keylife=1h
    left=192.168.1.1
    leftsubnet=10.0.0.0/24
    right=203.0.113.5
    rightsubnet=10.1.0.0/24
    auto=start
