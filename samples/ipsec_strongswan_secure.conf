# Sample Highly Secure strongSwan IPsec Configuration (NIST SP 800-77 Compliant)
config setup
    charondebug="ike 1, knl 1, cfg 1"

conn secure-cloud-tunnel
    keyexchange=ikev2
    authby=pubkey
    leftcert=gatewayCert.pem
    left=192.168.1.1
    right=198.51.100.25
    ike=aes256gcm16-sha256-ecp256!
    esp=aes256gcm16-ecp256!
    pfs=yes
    dpddelay=30s
    dpdaction=restart
    auto=start
